name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AlienFXControlCenter.csproj -p:Platform=x64

      - name: Build
        run: dotnet build AlienFXControlCenter.csproj -c Debug -p:Platform=x64 --no-restore
